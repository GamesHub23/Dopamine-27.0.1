name: "Dopamine: build and upload"

on:
  push:
    branches: ['*']
    paths-ignore: [".gitignore"]
  pull_request:
    branches: ['*']
    paths-ignore: [".gitignore"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Xcode Setup
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Procursus
        uses: dhinakg/procursus-action@main
        with:
          packages: ldid findutils sed coreutils make

      - name: Install build tools
        run: |
          brew install make libarchive openssl
          echo "PATH=$(brew --prefix make)/libexec/gnubin:$PATH" >> "$GITHUB_ENV"

      - name: Cache Theos and iOS SDK
        id: theos-cache
        uses: actions/cache@v4
        with:
          path: theos
          key: theos-${{ runner.os }}-iphoneos16.5-v1

      - name: Install THEOS
        if: steps.theos-cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          export BASEDIR="$PWD"
          export THEOS="$BASEDIR/theos"
          mkdir -p "$THEOS"
          curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos -o install-theos.sh
          gsed -E "/^\s*get_theos\s*$/,+1 s/^(\s*)(get_sdks)\s*$/\1mkdir -p \${THEOS}/sdks\n\1touch \${THEOS}/sdks/sdk\n\1\2/g" -i install-theos.sh
          bash install-theos.sh
          curl -fL https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz -o "$THEOS/sdks/iPhoneOS16.5.sdk.tar.xz"
          tar -xJf "$THEOS/sdks/iPhoneOS16.5.sdk.tar.xz" -C "$THEOS/sdks"
          rm "$THEOS/sdks/iPhoneOS16.5.sdk.tar.xz"

      - name: Cache trustcache
        id: trustcache-cache
        uses: actions/cache@v4
        with:
          path: .cache/trustcache
          key: trustcache-${{ runner.os }}-arm64-openssl-v1

      - name: Build trustcache
        if: steps.trustcache-cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          mkdir -p .cache
          git clone --depth 1 https://github.com/CRKatri/trustcache .cache/trustcache-src
          cd .cache/trustcache-src
          export CFLAGS="$CFLAGS -I$(brew --prefix openssl)/include -arch arm64"
          export LDFLAGS="$LDFLAGS -L$(brew --prefix openssl)/lib -arch arm64"
          gmake -j"$(sysctl -n hw.logicalcpu)" OPENSSL=1
          mkdir -p ../trustcache
          cp trustcache ../trustcache/trustcache

      - name: Install trustcache
        run: |
          sudo cp .cache/trustcache/trustcache /opt/procursus/bin/trustcache
          sudo chmod +x /opt/procursus/bin/trustcache

      - name: Set Environment Variables
        run: |
          set -euxo pipefail
          T2=$(TZ=UTC-2 date +'%Y%m%d_%H%M%S')
          TS=$(date -j -f "%Y%m%d_%H%M%S" "$T2" +%s)
          SHASH=$(git rev-parse --short HEAD)
          echo "ctime=$T2" >> "$GITHUB_ENV"
          echo "ctimestamp=$TS" >> "$GITHUB_ENV"
          echo "shorthash=$SHASH" >> "$GITHUB_ENV"

      - name: Cache Dopamine bootstraps
        uses: actions/cache@v4
        with:
          path: |
            Application/Dopamine/Resources/bootstrap_1800.tar.zst
            Application/Dopamine/Resources/bootstrap_1900.tar.zst
          key: dopamine-bootstraps-arm64-v1

      - name: Download missing bootstraps
        run: |
          set -euxo pipefail
          cd Application/Dopamine/Resources
          if [ ! -s bootstrap_1800.tar.zst ]; then
            curl -fL https://apt.procurs.us/bootstraps/1800/bootstrap-iphoneos-arm64.tar.zst -o bootstrap_1800.tar.zst
          fi
          if [ ! -s bootstrap_1900.tar.zst ]; then
            curl -fL https://apt.procurs.us/bootstraps/1900/bootstrap-iphoneos-arm64.tar.zst -o bootstrap_1900.tar.zst
          fi

      - name: Prepare BaseBin headers (.include)
        run: |
          set -euxo pipefail
          rm -rf BaseBin/.include
          mkdir -p BaseBin/.include
          cp -r BaseBin/_external/include/* BaseBin/.include/
          # The selected iOS SDK already provides XPC; avoid a duplicate module.
          rm -rf BaseBin/.include/xpc

      - name: Build Dopamine
        run: |
          set -euxo pipefail
          export BASEDIR="$PWD"
          export THEOS="$BASEDIR/theos"
          gmake -j"$(sysctl -n hw.logicalcpu)" NIGHTLY=1

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dopamine
          path: Application/Dopamine.ipa
          if-no-files-found: error
